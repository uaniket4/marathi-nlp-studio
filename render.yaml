# Render Blueprint — deploy the FastAPI backend from ./backend/Dockerfile.
# Create it on Render via: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: marathi-nlp-studio
    runtime: docker
    plan: free                       # 512 MB RAM — QUANTIZE=1 keeps torch+BERT lean
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: QUANTIZE               # int8 dynamic quantization to fit 512 MB
        value: "1"
      - key: TORCH_THREADS
        value: "1"
      - key: MODEL_NAME
        value: l3cube-pune/marathi-ner
      - key: MAX_LENGTH
        value: "256"
      - key: HF_HOME                # must match the Dockerfile's baked cache: the
        value: /app/hf_cache        # image bakes the model here + runs HF offline
      - key: CORS_ORIGINS           # allow the deployed frontend
        value: https://marathi-nlp-studio.vercel.app
